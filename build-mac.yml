name: Build Marketing OS Mac v.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      VERSI: "1.1.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - name: Kompilasi ( Apple Silicon + Intel )
        run: |
          set -e
          mkdir -p build
          swiftc -swift-version 5 -O -target arm64-apple-macos11  -o build/MarketingOS-arm64  MarketingOS.swift -framework Cocoa -framework WebKit
          swiftc -swift-version 5 -O -target x86_64-apple-macos10.15 -o build/MarketingOS-x86_64 MarketingOS.swift -framework Cocoa -framework WebKit
          lipo -create -output build/MarketingOS build/MarketingOS-arm64 build/MarketingOS-x86_64
          lipo -info build/MarketingOS
          ./build/MarketingOS --cek

      - name: Susun Marketing OS.app
        run: |
          set -e
          APP="build/dmg/Marketing OS.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/MarketingOS "$APP/Contents/MacOS/MarketingOS"
          chmod +x "$APP/Contents/MacOS/MarketingOS"
          cp aset/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          sed "s/VERSI/$VERSI/g" aset/Info.plist > "$APP/Contents/Info.plist"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          plutil -lint "$APP/Contents/Info.plist"
          # tanda tangan ad-hoc ( wajib supaya bisa jalan di Mac Apple Silicon )
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          sed "s/VERSI/$VERSI/g" aset/CARA-PASANG.txt > "build/dmg/CARA PASANG.txt"
          ln -s /Applications build/dmg/Applications

      - name: Buat DMG
        run: |
          set -e
          hdiutil create -volname "Marketing OS $VERSI" -srcfolder build/dmg -ov -format UDZO "build/MarketingOS-Mac-$VERSI.dmg"
          ls -la build/*.dmg

      - name: Simpan hasil
        uses: actions/upload-artifact@v4
        with:
          name: MarketingOS-Mac-${{ env.VERSI }}
          path: build/MarketingOS-Mac-*.dmg
